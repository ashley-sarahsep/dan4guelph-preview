<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>James's Quest</title>
<style>
  :root { --bezel: #d9cfb8; --bezel-dark: #b8ad94; }
  html, body { margin:0; padding:0; background:#1a1a1a; height:100%; overflow:hidden; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #monitor { position:relative; }
  #monitor.crt { padding: 3.2% 3.2% 5% 3.2%; background: linear-gradient(160deg, var(--bezel), var(--bezel-dark)); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.25); }
  #screenwrap { position:relative; background:#000; overflow:hidden; }
  #monitor.crt #screenwrap { border-radius: 10px / 14px; box-shadow: inset 0 0 40px rgba(0,0,0,.9); }
  canvas { display:block; }
  #crtfx { position:absolute; inset:0; pointer-events:none; display:none; }
  #monitor.crt #crtfx { display:block; }
  #crtfx::before { content:""; position:absolute; inset:0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px); mix-blend-mode: multiply; }
  #crtfx::after { content:""; position:absolute; inset:0; background: radial-gradient(ellipse at center, rgba(255,255,255,.06) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
  #powerlight { position:absolute; right:4%; bottom:1.6%; width:9px; height:9px; border-radius:50%; background:#49d16b; box-shadow:0 0 6px #49d16b; display:none; }
  #monitor.crt #powerlight { display:block; }
  #cmdrow { position:absolute; left:0; right:0; bottom:0; display:flex; gap:6px; padding:6px; background:#000; box-sizing:border-box; }
  #cmd { flex:1; background:#000; color:#fff; border:1px solid #555; padding:6px 8px; font: inherit; font-size:14px; outline:none; }
  #cmd::placeholder { color:#777; }
  .btn { background:#2a2a2a; color:#eee; border:1px solid #666; padding:6px 10px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn:active { background:#444; }
  #toggles { position:fixed; top:8px; right:10px; display:flex; gap:6px; z-index:5; }
  #touchpad { position:fixed; left:10px; bottom:10px; display:none; grid-template-columns: repeat(3, 44px); gap:4px; z-index:5; opacity:.85; }
  #touchpad button { width:44px; height:44px; font-size:18px; }
  body.touch #touchpad { display:grid; }
</style>
</head>
<body>
<div id="toggles">
  <button class="btn" id="crtbtn">CRT: on</button>
</div>
<div id="stage">
  <div id="monitor" class="crt">
    <div id="screenwrap">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="crtfx"></div>
      <div id="cmdrow">
        <input id="cmd" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type LOOK to see what is here, or ASK DAD if you are stuck">
        <button class="btn" id="bucketbtn" type="button">Bucket</button>
        <button class="btn" id="helpbtn" type="button">Help</button>
        <button class="btn" id="optbtn" type="button">Options</button>
      </div>
    </div>
    <div id="powerlight"></div>
  </div>
</div>
<div id="touchpad">
  <span></span><button class="btn" data-k="ArrowUp">▲</button><span></span>
  <button class="btn" data-k="ArrowLeft">◀</button><button class="btn" data-k="ArrowDown">▼</button><button class="btn" data-k="ArrowRight">▶</button>
</div>

// ---------------------------------------------------------------- STATE
const START = () => ({
  screen: 'street', x: 40, y: 165, facing: 1,
  score: 0, got: {}, flags: {}, inv: ['bucket'], signs: 4, placed: {}, names: {},
  seenIntro: false, done: false,
});
let S = START();
const SAVE_KEY = 'jamesquest-small-v1';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const s = localStorage.getItem(SAVE_KEY); if (!s) return null;
    const g = JSON.parse(s);
    // A save from an older build is missing whatever was added since, and
    // the code reads those keys without asking. Fill them in on the way in
    // rather than guarding every use.
    const d = START();
    for (const k in d) if (g[k] === undefined || g[k] === null) g[k] = d[k];
    return g;
  } catch (e) { return null; }
}
// Save whenever the game goes away: the tab is closed or hidden, or the
// overlay is shut and the iframe torn down. award() and goScreen() already
// save at every scoring moment, so this is only the few steps since the
// last one - but those few steps are exactly what a player notices losing.
window.addEventListener('pagehide', () => { try { save(); } catch (e) {} });
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { save(); } catch (e) {} } });

// ---------------------------------------------------------------- ENGINE
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = true;
// The canvas is 960x600 but the game thinks in 320x200, which is what every
// hotspot, walk band and sprite position in this file is written in. Scaling
// the context by 3 once here means none of them had to change.

  if (S.screen === 'bean') { if (!f.spiderHi) key = 'spider'; else if (!f.catMoved) key = 'glasses'; else if (!f.gusGlasses) key = has('glasses') ? 'giveGlasses' : 'glasses'; else if (!S.placed.C) key = 'signB'; }
  if (S.screen === 'market') { if (!f.metScarecrow) key = 'scarecrow'; else if (!S.placed.D) key = 'signD'; }
  if (S.screen === 'school') { if (!has('jar') && !f.lit) key = 'noFlame'; else if (!f.upstairs) key = 'stairs'; else if (!f.lit) key = 'light'; }
  if (!key) return say(pick(TXT.dadIdle[S.screen]));
  const n = (S.flags['hint_' + key] || 0); S.flags['hint_' + key] = n + 1;
  const tiers = H[key]; return say(tiers[Math.min(n, tiers.length - 1)]);
}

// ---------------------------------------------------------------- INPUT
const cmd = document.getElementById('cmd');
function run(line) { if (!line.trim()) return; cmd.value = ''; echo(line); parse(line); }
function echo(line) { cmd.placeholder = '> ' + line; }
cmd.addEventListener('keydown', e => {
  // Arrows get out of the text box and reach the game. Typing any letter
  // focuses this input, so without this the arrows stopped working for good
  // the moment the player typed one command - and walking matters more here
  // than moving a caret along a line that is rarely more than four words.
  if (e.key.startsWith('Arrow')) return;
  // Enter dismisses the text box before it submits anything. The input holds
  // focus the whole time you play, so the window handler that dismisses on
  // Enter never saw it, and the only way past a message was to click - which
  // is the complaint. Space is deliberately not a dismiss key in here, since
  // commands contain spaces.
  if (titleUp && (e.key === 'Enter' || e.key === ' ')) { titleUp = false; e.preventDefault(); e.stopPropagation(); return; }
  if (e.key === 'Enter') {
    if ((panel || bucketOpen) && cmd.value.trim()) { panel = null; bucketOpen = false; run(cmd.value); e.preventDefault(); e.stopPropagation(); return; }
    if (panel) { panelNext(); e.preventDefault(); e.stopPropagation(); return; }
    if (bucketOpen) { bucketOpen = false; e.preventDefault(); e.stopPropagation(); return; }
    if (msgOpen) { nextMsg(); e.preventDefault(); e.stopPropagation(); return; }
    run(cmd.value); e.preventDefault();
  }
  if (e.key === 'Escape' && (panel || bucketOpen)) { panel = null; bucketOpen = false; e.preventDefault(); e.stopPropagation(); return; }
  if (e.key === 'Escape') cmd.blur();
  e.stopPropagation();
});
window.addEventListener('keydown', e => {
  if (e.target === cmd && !e.key.startsWith('Arrow')) return;
  if (titleUp) { titleUp = false; e.preventDefault(); return; }
  if (finaleState && finaleState.stage === 2 && e.key === 'Enter') { S = START(); awarded = {}; finaleState = null; save(); beginIntro(); return; }
  if (panel && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) {
    if (e.key === 'Escape') panel = null; else panelNext();
    e.preventDefault(); return;
  }
  if (bucketOpen && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) { bucketOpen = false; e.preventDefault(); return; }
  if (msgOpen && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) { nextMsg(); e.preventDefault(); return; }
  if (catPlay && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) { endCat(); e.preventDefault(); return; }
  if (e.key === 'h' || e.key === 'H') { debug = !debug; return; }
  if (e.key === 'F5') { e.preventDefault(); save(); say('Saved.'); return; }
  if (e.key === 'F7') { e.preventDefault(); const l = load(); if (l) { S = l; say('Restored.'); } return; }
  if (e.key.startsWith('Arrow')) { keys[e.key] = true; e.preventDefault(); return; }
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) { cmd.focus(); }
});
window.addEventListener('keyup', e => { if (e.key.startsWith('Arrow')) keys[e.key] = false; });
document.querySelectorAll('#touchpad button').forEach(b => { const k = b.dataset.k; const on = e => { e.preventDefault(); keys[k] = true; }; const off = e => { e.preventDefault(); keys[k] = false; }; b.addEventListener('touchstart', on); b.addEventListener('touchend', off); b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off); });
// The pad is the only way to walk on a touch device now that tapping the
// ground does nothing, so show it for a coarse pointer too - a tablet or a
// phone that does not report ontouchstart would otherwise have no way to
// move at all.
if ('ontouchstart' in window || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) document.body.classList.add('touch');

function canvasPoint(e) { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: Math.floor((t.clientX - r.left) / r.width * 320), y: Math.floor((t.clientY - r.top) / r.height * 200) }; }
// How a verb reads when the game types the command for you. It was the bare
// verb and the name joined by a space, which produced "talk the neighbours'
// house" and "look the candle" - the game narrating itself in broken English
// to a child who is learning to read it.
const PREP = { look: 'look at', take: 'take', use: 'use', talk: 'talk to' };

// What the game types when a hotspot is tapped. Falls back to PREP + name.
// A hotspot can override a verb where the natural phrase is not the generic
// one: you do not talk to a house, you knock on its door.
function phrase(verb, id) {
  const h = hs(id); if (!h) return verb;
  if (h.as && h.as[verb]) return h.as[verb];
  const n = h.name;
  // No article in front of one that is already there, a possessive, or a
  // person's name. Dumping every phrase in the game is what caught "the our
  // house" and "the our lawn"; spot-checking two of them would not have.
  const has = /^(the |a |an |our |your |my |his |her |their )/i.test(n) || /^[A-Z]/.test(n);
  return PREP[verb] + ' ' + (has ? n : 'the ' + n);
}

// Minimum tap target, in game pixels. The candle is 11 by 13 in the art,
// which is about 13 CSS pixels on a phone - nothing like a tap target, and
// the player is six. The hit test grows anything smaller to MIN_TAP, centred
// on the real rectangle. The rectangle stays honest, so sprite positions and
// the H overlay still say where the thing actually is, and the smallest-area
// rule still uses the real area - so a padded candle still beats the porch
// it is sitting on.
const MIN_TAP = 20;

// A hotspot with `when` is not tappable until that flag is set. The glasses
// are the reason: their rectangle sits under the cat's and is smaller, so
// smallest-area-wins handed you the glasses every time you tapped the cat -
// which gives away the one puzzle on the screen before you have solved it.
// The sprite was already gated on the same flag; the hit test was not.
function live(h, id) {
  if (h.when && !S.flags[h.when]) return false;     // not revealed yet
  if (h.unless && S.flags[h.unless]) return false;  // there, then gone
  if (h.item && has(id)) return false;              // already in the bucket
  return true;
}

function hitHotspot(p) { const H = cur().hotspots; let best = null, bestArea = 1e9; for (const id in H) {
    const h = H[id];
    if (!live(h, id)) continue;
    const px = Math.max(0, (MIN_TAP - h.w) / 2), py = Math.max(0, (MIN_TAP - h.h) / 2);
    if (p.x >= h.x - px && p.x <= h.x + h.w + px && p.y >= h.y - py && p.y <= h.y + h.h + py) {
      const a = h.w * h.h; if (a < bestArea) { best = id; bestArea = a; }
    }
  } return best; }
function onTap(e) {
  e.preventDefault(); const p = canvasPoint(e);
  if (titleUp) { titleUp = false; return; }
  if (finaleState) { if (finaleState.stage === 2) { S = START(); awarded = {}; finaleState = null; save(); beginIntro(); } else if (msgOpen) nextMsg(); return; }
  if (panel) { panelNext(); return; }
  if (msgOpen) { nextMsg(); return; }
  if (endCat()) return;
  if (bucketOpen) { bucketOpen = false; return; }
  if (debug) console.log('tap', p);
  // Tapping bare ground used to send James walking there. The campaign asked
  // for the arrows to be how you walk, and they are right: click-to-walk and
  // tap-to-interact on the same surface means every missed tap on a small
  // thing marches him across the screen instead, which is worse than nothing
  // happening. Arrow keys on a keyboard, the on-screen pad on a touch
  // device, and the game still walks him itself for any command that needs
  // him somewhere - that is walkToThen and it is untouched.
}
cv.addEventListener('mousedown', onTap); cv.addEventListener('touchstart', onTap, { passive: false });

// The two bottom-bar buttons. They open a panel and hand focus straight
// back to the command line, so a player who was typing is not stranded.
document.getElementById('bucketbtn').onclick = () => { bucketOpen = !bucketOpen; panel = null; cmd.focus(); };
document.getElementById('helpbtn').onclick = () => { panel = { k: 'help', pg: 0 }; cmd.focus(); };
document.getElementById('optbtn').onclick = () => { panel = { k: 'opts', pg: 0 }; cmd.focus(); };
document.getElementById('crtbtn').onclick = () => { const m = document.getElementById('monitor'); m.classList.toggle('crt'); document.getElementById('crtbtn').textContent = 'CRT: ' + (m.classList.contains('crt') ? 'on' : 'off'); fit(); };
function fit() {
  const stage = document.getElementById('stage'); const crt = document.getElementById('monitor').classList.contains('crt');
  const pad = crt ? 0.9 : 1; const availW = stage.clientWidth * pad, availH = (stage.clientHeight - 60) * pad;
  let scale = Math.min(availW / 320, availH / 200);
  scale = scale >= 2 ? Math.floor(scale) : Math.max(0.9, Math.floor(scale * 10) / 10);
  cv.style.width = (320 * scale) + 'px'; cv.style.height = (200 * scale) + 'px';
  document.getElementById('screenwrap').style.width = (320 * scale) + 'px'; document.getElementById('screenwrap').style.height = (200 * scale + 40) + 'px';
}
window.addEventListener('resize', fit);
if (window.innerWidth < 700) { document.getElementById('monitor').classList.remove('crt'); document.getElementById('crtbtn').textContent = 'CRT: off'; }
fit();

// ---------------------------------------------------------------- START
function onEnterQuiet() { dadX = S.x - 22; dadY = S.y + 2; }
function beginIntro() { titleUp = true; S.flags.seen_street = true; say([...TXT.intro]); }
(function boot() {
  // Resume without asking. This used to be a confirm(), which meant one
  // stray click on Cancel threw the whole game away - the easiest way to
  // lose progress in the game was a dialog box asking whether you wanted to
  // keep it. Starting over is a deliberate act now: type RESTART.
  const l = load();
  if (l && !l.done) {
    S = l; awarded = {}; for (const k in S.got) awarded[k] = true; onEnterQuiet();
    titleUp = true;
    say('Back where you left off. ' + S.score + ' of ' + MAX_SCORE + ' so far. Type RESTART if you would rather begin again.');
  } else { S = START(); beginIntro(); }
  setInterval(() => { update(); render(); }, 1000 / 15);
})();
</script>
