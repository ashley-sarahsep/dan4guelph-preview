<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>James's Quest</title>
<style>
  :root { --bezel: #d9cfb8; --bezel-dark: #b8ad94; }
  html, body { margin:0; padding:0; background:#1a1a1a; height:100%; overflow:hidden; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #monitor { position:relative; }
  #monitor.crt { padding: 3.2% 3.2% 5% 3.2%; background: linear-gradient(160deg, var(--bezel), var(--bezel-dark)); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.25); }
  #screenwrap { position:relative; background:#000; overflow:hidden; }
  #monitor.crt #screenwrap { border-radius: 10px / 14px; box-shadow: inset 0 0 40px rgba(0,0,0,.9); }
  canvas { display:block; }
  #crtfx { position:absolute; inset:0; pointer-events:none; display:none; }
  #monitor.crt #crtfx { display:block; }
  #crtfx::before { content:""; position:absolute; inset:0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px); mix-blend-mode: multiply; }
  #crtfx::after { content:""; position:absolute; inset:0; background: radial-gradient(ellipse at center, rgba(255,255,255,.06) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
  #powerlight { position:absolute; right:4%; bottom:1.6%; width:9px; height:9px; border-radius:50%; background:#49d16b; box-shadow:0 0 6px #49d16b; display:none; }
  #monitor.crt #powerlight { display:block; }
  #cmdrow { position:absolute; left:0; right:0; bottom:0; display:flex; gap:6px; padding:6px; background:#000; box-sizing:border-box; }
  #cmd { flex:1; background:#000; color:#fff; border:1px solid #555; padding:6px 8px; font: inherit; font-size:14px; outline:none; }
  #cmd::placeholder { color:#777; }
  .btn { background:#2a2a2a; color:#eee; border:1px solid #666; padding:6px 10px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn:active { background:#444; }
  #toggles { position:fixed; top:8px; right:10px; display:flex; gap:6px; z-index:5; }
  #touchpad { position:fixed; left:10px; bottom:10px; display:none; grid-template-columns: repeat(3, 44px); gap:4px; z-index:5; opacity:.85; }
  #touchpad button { width:44px; height:44px; font-size:18px; }
  body.touch #touchpad { display:grid; }
</style>
</head>
<body>
<div id="toggles">
  <button class="btn" id="crtbtn">CRT: on</button>
</div>
<div id="stage">
  <div id="monitor" class="crt">
    <div id="screenwrap">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="crtfx"></div>
      <div id="cmdrow">
        <input id="cmd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type something, or tap things in the picture">
        <button class="btn" id="askdad">Ask Dad</button>
        <button class="btn" id="bucketbtn">Bucket</button>
      </div>
    </div>
    <div id="powerlight"></div>
  </div>
</div>
<div id="touchpad">
  <span></span><button class="btn" data-k="ArrowUp">▲</button><span></span>
  <button class="btn" data-k="ArrowLeft">◀</button><button class="btn" data-k="ArrowDown">▼</button><button class="btn" data-k="ArrowRight">▶</button>
</div>

// ---------------------------------------------------------------- STATE
const START = () => ({
  screen: 'street', x: 40, y: 165, facing: 1,
  score: 0, got: {}, flags: {}, inv: ['bucket'], signs: 3, placed: {},
  seenIntro: false, done: false,
});
let S = START();
const SAVE_KEY = 'jamesquest-small-v1';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

// ---------------------------------------------------------------- ENGINE
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = true;
// The canvas is 960x600 but the game thinks in 320x200, which is what every
// hotspot, walk band and sprite position in this file is written in. Scaling
// the context by 3 once here means none of them had to change.
//
// The backgrounds are the Midjourney renders cropped and resized, not EGA
// quantised. They were prompted as Sierra-style pixel art and arrived looking
// the part, so quantising them was spending detail to manufacture a look they
// already had - at 320x200 the pumpkin on the porch step stopped reading as a
// pumpkin at all. scenes/backgrounds.py is the whole pipeline now.
const PX = 3;
ctx.scale(PX, PX);
const bgImgs = {};
// Optional picture sprites. If assets/sprites/<name>.png exists it replaces the
// hand-pixeled one. Make them with tools/sprite.py (RGBA, game-pixel height,
// facing right, feet at the bottom row).
const IMGSPR = {}; const IMGSPR_NAMES = ['james', 'dad', 'gus', 'cat', 'spider', 'sign', 'pumpkin_dark', 'pumpkin_lit', 'candle', 'jar', 'patel', 'bucket', 'candy', 'glasses', 'dadicon'];
for (const n of IMGSPR_NAMES) { const im = new Image(); im.src = 'assets/sprites/' + n + '.png'; im.onload = () => { IMGSPR[n] = im; }; im.onerror = () => {}; }
function sprName(spr) { for (const k in SPR) if (SPR[k] === spr) return k; return null; }
for (const k in SCREENS) { const im = new Image(); im.src = SCREENS[k].bg; im.onload = () => { bgImgs[k] = im; }; im.onerror = () => {}; }
// The lit school is a second background rather than a screen: it replaces
// school.png from the moment the lantern catches, and again under the
// finale. Loaded the same guarded way, so a missing file falls back to the
// old treatment instead of breaking the ending.
{ const im = new Image(); im.src = 'assets/bg/school_lit.png'; im.onload = () => { bgImgs.school_lit = im; }; im.onerror = () => {}; }

let debug = false, tick = 0, walkTarget = null, keys = {}, msgQueue = [], msgOpen = null, verbCoin = null, bucketOpen = false, selectedItem = null, finaleState = null;
let dadX = 20, dadY = 165, dadFacing = 1, dadStep = 0;
let awarded = {};

// Twelve deeds at five points: nine award() calls plus the three signs.
// This read "of 50" in three places and a child who finished the game was
// shown 60 of 50, which looks like a bug to the one person who must not
// think the game is broken.
const MAX_SCORE = 60;
function award(key, pts) { if (awarded[key]) return; awarded[key] = true; S.score += pts; S.got[key] = true; flash = { t: 30, txt: '+' + pts }; save(); }
let flash = null;

function say(lines) { if (!Array.isArray(lines)) lines = [lines]; for (const l of lines) msgQueue.push(fill(l)); if (!msgOpen) nextMsg(); }
function nextMsg() { msgOpen = msgQueue.length ? msgQueue.shift() : null; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fill(s) { return s.replace(/\[cat\]/g, FILL.cat).replace(/\[costume\]/g, FILL.costume).replace(/\[funny thing James says\]/g, FILL.funny); }

// Fill these in. They are the only placeholders.
const FILL = { cat: 'Valanice', costume: 'Super Kid suit', funny: 'Super Kid, away!' };

function cur() { return SCREENS[S.screen]; }
function hs(id) { return cur().hotspots[id]; }
function has(item) { return S.inv.includes(item); }
function give(item) { if (!has(item)) S.inv.push(item); }
function drop(item) { S.inv = S.inv.filter(i => i !== item); }

// walking
// Pixels per frame. The loop runs at 15fps, which is the period feel and
// stays. At the original 2 that was 30 pixels a second, so crossing the
// street took eleven seconds and the six year old this is for spent most of
// the game watching someone walk. At 4 it is five and a half, which is still
// unhurried. Sierra shipped a walk-speed setting for the same reason.
const STEP = 4;
function clampWalk(x, y) { const w = cur().walk; return [Math.max(6, Math.min(314, x)), Math.max(w.y0, Math.min(w.y1, y))]; }
function update() {
  tick++;
  if (S.flags.finalePending && !msgOpen && !msgQueue.length && !finaleState) { S.flags.finalePending = false; S.done = true; startFinale(); }
  if (msgOpen || bucketOpen || verbCoin || finaleState) return;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft) dx -= STEP; if (keys.ArrowRight) dx += STEP; if (keys.ArrowUp) dy -= 1; if (keys.ArrowDown) dy += 1;
  if (dx || dy) walkTarget = null;
  if (walkTarget) {
    const tx = walkTarget.x - S.x, ty = walkTarget.y - S.y;
    if (Math.abs(tx) <= STEP && Math.abs(ty) <= 1) { S.x = walkTarget.x; walkTarget.onArrive && walkTarget.onArrive(); walkTarget = null; }
    else { dx = Math.sign(tx) * Math.min(STEP, Math.abs(tx)); dy = Math.sign(ty) * Math.min(1, Math.abs(ty)); }
  }
  if (dx || dy) {
    if (dx) S.facing = dx > 0 ? 1 : -1;
    [S.x, S.y] = clampWalk(S.x + dx, S.y + dy);
    S.walking = true;
    // exits
    const ex = cur().exits;
    if (S.x >= 314 && ex.right) goScreen(ex.right, 'left');
    else if (S.x <= 6 && ex.left) goScreen(ex.left, 'right');
  } else S.walking = false;
  // dad follows
  const gap = 22 * S.facing;
  const dtx = S.x - gap, dty = S.y + 2;
  const ddx = dtx - dadX, ddy = dty - dadY;
  if (Math.abs(ddx) > 2 || Math.abs(ddy) > 1) { dadX += Math.sign(ddx) * Math.min(2, Math.abs(ddx)); dadY += Math.sign(ddy); dadFacing = ddx !== 0 ? Math.sign(ddx) : dadFacing; dadStep++; }
}
function goScreen(name, side) {
  S.screen = name; const sc = SCREENS[name];
  S.x = side === 'left' ? 8 : 312; S.y = Math.max(sc.walk.y0, Math.min(sc.walk.y1, S.y));
  dadX = side === 'left' ? -10 : 330; dadY = S.y + 2; walkTarget = null;
  onEnter(); save();
}
function onEnter() {
  const n = S.screen;
  if (!S.flags['seen_' + n]) {
    S.flags['seen_' + n] = true;
    if (n === 'street') say(TXT.street.enter);
    if (n === 'bean') say([TXT.bean.enter, TXT.bean.enterDad]);
    if (n === 'school') say(S.flags.lit ? TXT.school.enterLit : TXT.school.enter);
  }
}

// ---------------------------------------------------------------- DRAW
function drawSprite(spr, frame, x, y, flip) { // x,y = bottom-centre
  const nm = sprName(spr), im = nm && IMGSPR[nm];
  if (im) return drawImgSprite(im, frame, x, y, flip);
  const f = spr.frames[frame % spr.frames.length]; const w = spr.w, h = spr.h;
  const left = Math.round(x - w / 2), top = Math.round(y - h);
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = f[r][flip ? w - 1 - c : c]; const p = PAL[ch]; if (p == null) continue;
    ctx.fillStyle = EGA[p]; ctx.fillRect(left + c, top + r, 1, 1);
  }
}
function drawImgSprite(im, frame, x, y, flip) {
  // The file is PX times the logical size, so that a sprite keeps its detail
  // on a 960x600 canvas while the game goes on thinking in 320x200. Source
  // rectangles are therefore in file pixels and destinations in game units.
  const w = im.width / PX, h = im.height / PX;
  const left = Math.round(x - w / 2), top = Math.round(y - h);
  const legs = Math.max(4, Math.round(h * 0.38)); // bottom part that shuffles
  const bob = frame ? 1 : 0, shift = frame === 1 ? 1 : frame === 2 ? -1 : 0;
  ctx.save();
  if (flip) { ctx.translate(left + w, 0); ctx.scale(-1, 1); ctx.translate(-left, 0); }
  ctx.drawImage(im, 0, 0, w * PX, (h - legs) * PX, left, top - bob, w, h - legs);
  ctx.drawImage(im, 0, (h - legs) * PX, w * PX, legs * PX, left + shift, top - bob + h - legs, w, legs);
  if (frame) { ctx.drawImage(im, 0, (h - 2) * PX, w * PX, 2 * PX, left, top + h - 2 - bob, w, 2 + bob); }
  ctx.restore();
}
function drawPlaceholder(sc) {
  const [sky, ground, mid] = sc.placeholder;
  ctx.fillStyle = EGA[sky]; ctx.fillRect(0, 0, 320, 200);
  ctx.fillStyle = EGA[ground]; ctx.fillRect(0, sc.walk.y0 - 6, 320, 200);
  ctx.fillStyle = EGA[mid]; ctx.fillRect(0, sc.walk.y0 - 30, 320, 26);
  ctx.fillStyle = EGA[15]; ctx.font = '8px monospace'; ctx.fillText('missing ' + sc.bg, 8, 24);
}
function text(s, x, y, col = 0) { ctx.fillStyle = EGA[col]; ctx.font = '8px monospace'; ctx.textBaseline = 'top'; ctx.fillText(s, x, y); }
function wrap(s, maxChars) { const words = s.split(' '), lines = []; let line = ''; for (const w of words) { if ((line + ' ' + w).trim().length > maxChars) { lines.push(line.trim()); line = w; } else line += ' ' + w; } if (line.trim()) lines.push(line.trim()); return lines; }

function render() {
  const sc = cur();
  if (finaleState) return drawFinale();
  // background
  const bgKey = (S.screen === 'school' && S.flags.lit && bgImgs.school_lit) ? 'school_lit' : S.screen;
  if (bgImgs[bgKey]) ctx.drawImage(bgImgs[bgKey], 0, 0, 320, 200); else drawPlaceholder(sc);
  // scene sprites (drawn in y order with actors)
  const draws = [];
  const H = sc.hotspots;
  if (S.screen === 'street') {
    if (!has('candle') && !S.flags.pumpkinLit) draws.push({ y: H.candle.sy, f: () => drawSprite(SPR.candle, 0, H.candle.sx, H.candle.sy) });
    draws.push({ y: H.pumpkin.sy, f: () => drawSprite(S.flags.pumpkinLit ? SPR.pumpkin_lit : SPR.pumpkin_dark, 0, H.pumpkin.sx, H.pumpkin.sy) });
    // Mrs. Patel comes to the door and stays there. She is the best moment in
    // the game and was text only until the campaign drew her. Guarded on the
    // image rather than given a hand-pixeled fallback: there is no SPR.patel,
    // and an absent neighbour is better than a crash.
    if (S.flags.candyGot && IMGSPR.patel) draws.push({ y: 151, f: () => drawImgSprite(IMGSPR.patel, 0, 240, 153, false) });
    if (S.placed.A) draws.push({ y: 176, f: () => drawSprite(SPR.sign, 0, 26, 170) });
    if (S.placed.B) draws.push({ y: 164, f: () => drawSprite(SPR.sign, 0, 250, 162) });
  }
  if (S.screen === 'bean') {
    const sp = H.spider; draws.push({ y: 300, f: () => drawSprite(SPR.spider, 0, S.flags.spiderHi ? sp.sx + 4 : sp.sx, S.flags.spiderHi ? sp.sy - 10 : sp.sy) });
    draws.push({ y: H.gus.sy, f: () => drawSprite(SPR.gus, 0, H.gus.sx, H.gus.sy) });
    if (S.flags.gusGlasses) draws.push({ y: 301, f: () => drawSprite(SPR.glasses, 0, H.gus.sx + 1, H.gus.sy - 28) });
    if (S.flags.catMoved) draws.push({ y: H.cat.sy, f: () => drawSprite(SPR.cat, 0, H.cat.sx + 8, H.cat.sy, true) });
    else draws.push({ y: H.cat.sy, f: () => drawSprite(SPR.cat, 0, H.cat.sx, H.cat.sy) });
    if (S.flags.catMoved && !has('glasses') && !S.flags.gusGlasses) draws.push({ y: H.glasses.sy, f: () => drawSprite(SPR.glasses, 0, H.glasses.sx - 8, H.glasses.sy) });
    if (S.placed.C) draws.push({ y: 147, f: () => drawSprite(SPR.sign, 0, 52, 152) });
  }
  if (S.screen === 'school') {
    // Only fake the glow when there is no painted lit school to show. With
    // one loaded this drew a yellow rectangle in the sky beside the real
    // lantern, because the background had already changed underneath it.
    if (S.flags.lit && !bgImgs.school_lit) { ctx.fillStyle = EGA[14]; const L = H.lantern; ctx.fillRect(L.x + 4, L.y + 4, L.w - 8, L.h - 8); ctx.fillStyle = EGA[12]; ctx.fillRect(L.x + 2, L.y + 2, L.w - 4, 2); }
  }
  // actors
  const jf = S.walking ? (Math.floor(tick / 6) % 2 ? 1 : 2) : 0;
  draws.push({ y: S.y, f: () => drawSprite(SPR.james, jf, S.x, S.y, S.facing < 0) });
  const dmoving = Math.abs((S.x - 22 * S.facing) - dadX) > 2;
  const df = dmoving ? (Math.floor(dadStep / 6) % 2 ? 1 : 2) : 0;
  draws.push({ y: dadY, f: () => drawSprite(SPR.dad, df, dadX, dadY, dadFacing < 0) });
  draws.sort((a, b) => a.y - b.y).forEach(d => d.f());

  // status bar
  ctx.fillStyle = EGA[15]; ctx.fillRect(0, 0, 320, 10);
  text(`Score: ${S.score} of ${MAX_SCORE}`, 4, 1, 0);
  text("James's Quest", 124, 1, 0);
  text('Bucket', 284, 1, 0);
  if (flash && flash.t > 0) { text(flash.txt, 92, 1, 4); flash.t--; }

  if (debug) { ctx.fillStyle = 'rgba(0,255,0,.18)'; ctx.fillRect(0, sc.walk.y0, 320, sc.walk.y1 - sc.walk.y0); ctx.strokeStyle = '#f0f'; ctx.lineWidth = 1; for (const k in H) { const h = H[k]; ctx.strokeRect(h.x + .5, h.y + .5, h.w, h.h); text(k, h.x + 1, h.y + 1, 13); } }

  if (verbCoin) drawVerbCoin();
  if (bucketOpen) drawBucket();
  if (msgOpen) drawMsg(msgOpen);

document.querySelectorAll('#touchpad button').forEach(b => { const k = b.dataset.k; const on = e => { e.preventDefault(); keys[k] = true; }; const off = e => { e.preventDefault(); keys[k] = false; }; b.addEventListener('touchstart', on); b.addEventListener('touchend', off); b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off); });
if ('ontouchstart' in window) document.body.classList.add('touch');

function canvasPoint(e) { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: Math.floor((t.clientX - r.left) / r.width * 320), y: Math.floor((t.clientY - r.top) / r.height * 200) }; }
function hitHotspot(p) { const H = cur().hotspots; let best = null, bestArea = 1e9; for (const id in H) { const h = H[id]; if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) { const a = h.w * h.h; if (a < bestArea) { best = id; bestArea = a; } } } return best; }
function onTap(e) {
  e.preventDefault(); const p = canvasPoint(e);
  if (finaleState) { if (finaleState.stage === 2) { S = START(); awarded = {}; finaleState = null; save(); beginIntro(); } else if (msgOpen) nextMsg(); return; }
  if (msgOpen) { nextMsg(); return; }
  if (p.y < 10 && p.x > 270) { bucketOpen = !bucketOpen; return; }
  if (bucketOpen) { const r = bucketRects.find(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h); if (r) { selectedItem = selectedItem === r.it ? null : r.it; if (selectedItem) { bucketOpen = false; echo('use ' + (r.it === 'dad' ? 'dad' : ITEMS[r.it].name) + ' on...'); } } else bucketOpen = false; return; }
  if (verbCoin) { const r = verbCoin.rects.find(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h); const id = verbCoin.id; verbCoin = null; if (r) { echo(r.it.toLowerCase() + ' ' + hs(id).name); doVerb(r.it.toLowerCase(), id); } return; }
  if (debug) console.log('tap', p);
  const id = hitHotspot(p);
  if (selectedItem) { if (id) { echo('use ' + (selectedItem === 'dad' ? 'dad' : ITEMS[selectedItem].name) + ' on ' + hs(id).name); walkToThen(id, () => useOn(selectedItem, id)); } else selectedItem = null; return; }
  if (id && !['street', 'plaza'].includes(id)) { verbCoin = { x: p.x, y: p.y, id }; return; }
  const [x, y] = clampWalk(p.x, p.y); walkTarget = { x, y };
}
cv.addEventListener('mousedown', onTap); cv.addEventListener('touchstart', onTap, { passive: false });

document.getElementById('crtbtn').onclick = () => { const m = document.getElementById('monitor'); m.classList.toggle('crt'); document.getElementById('crtbtn').textContent = 'CRT: ' + (m.classList.contains('crt') ? 'on' : 'off'); fit(); };
function fit() {
  const stage = document.getElementById('stage'); const crt = document.getElementById('monitor').classList.contains('crt');
  const pad = crt ? 0.9 : 1; const availW = stage.clientWidth * pad, availH = (stage.clientHeight - 60) * pad;
  let scale = Math.min(availW / 320, availH / 200);
  scale = scale >= 2 ? Math.floor(scale) : Math.max(0.9, Math.floor(scale * 10) / 10);
  cv.style.width = (320 * scale) + 'px'; cv.style.height = (200 * scale) + 'px';
  document.getElementById('screenwrap').style.width = (320 * scale) + 'px'; document.getElementById('screenwrap').style.height = (200 * scale + 40) + 'px';
}
window.addEventListener('resize', fit);
if (window.innerWidth < 700) { document.getElementById('monitor').classList.remove('crt'); document.getElementById('crtbtn').textContent = 'CRT: off'; }
fit();

// ---------------------------------------------------------------- START
function onEnterQuiet() { dadX = S.x - 22; dadY = S.y + 2; }
function beginIntro() { S.flags.seen_street = true; say([...TXT.intro]); }
(function boot() {
  const l = load();
  if (l && !l.done && confirm("Continue where you left off?")) { S = l; awarded = {}; for (const k in S.got) awarded[k] = true; onEnterQuiet(); }
  else { S = START(); beginIntro(); }
  setInterval(() => { update(); render(); }, 1000 / 15);
})();
</script>
